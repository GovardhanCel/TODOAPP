name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ${{ secrets.ACR_URL }}
  REGISTRY_USERNAME: ${{ secrets.ACR_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.ACR_PASSWORD }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests
        working-directory: ./backend
        run: npm test --if-present

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint --if-present

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test --if-present

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_URL }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: branch

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.ACR_URL }}/todoapp-backend:latest
            ${{ secrets.ACR_URL }}/todoapp-backend:${{ github.sha }}
            ${{ secrets.ACR_URL }}/todoapp-backend:${{ steps.branch.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.ACR_URL }}/todoapp-frontend:latest
            ${{ secrets.ACR_URL }}/todoapp-frontend:${{ github.sha }}
            ${{ secrets.ACR_URL }}/todoapp-frontend:${{ steps.branch.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_API_URL=https://todoapp.example.com/api
            REACT_APP_WEBSOCKET_URL=wss://todoapp.example.com/ws

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Update image references in K8s manifests
        run: |
          sed -i 's|<ACR_URL>|${{ secrets.ACR_URL }}|g' k8s/*.yaml

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/01-namespace.yaml
          kubectl apply -f k8s/02-secrets-configmap.yaml
          kubectl apply -f k8s/03-postgres-deployment.yaml
          kubectl apply -f k8s/04-backend-deployment.yaml
          kubectl apply -f k8s/05-frontend-deployment.yaml
          kubectl apply -f k8s/06-ingress.yaml
          kubectl apply -f k8s/07-hpa.yaml

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/todoapp-backend -n todoapp --timeout=5m
          kubectl rollout status deployment/todoapp-frontend -n todoapp --timeout=5m

      - name: Get service endpoints
        run: |
          echo "Backend Service:"
          kubectl get svc todoapp-backend -n todoapp
          echo "Frontend Service:"
          kubectl get svc todoapp-frontend -n todoapp
