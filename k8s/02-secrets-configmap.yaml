apiVersion: v1
kind: Secret
metadata:
  name: todoapp-secrets
  namespace: todoapp
type: Opaque
stringData:
  database-url: "postgresql://todouser:todopass@postgres:5432/tododb"
  jwt-secret: "your-super-secret-jwt-key-change-in-production"
  db-user: "todouser"
  db-password: "todopass"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todoapp-config
  namespace: todoapp
data:
  NODE_ENV: "production"
  PORT: "5000"
  WEBSOCKET_PORT: "5001"
  CORS_ORIGIN: "https://yourdomainhere.com"
