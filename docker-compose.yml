services:
  postgres:
    image: postgres:15-alpine
    container_name: todoapp-postgres
    environment:
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopass
      POSTGRES_DB: tododb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todouser"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todoapp-backend
    environment:
      DATABASE_URL: postgresql://todouser:todopass@postgres:5432/tododb
      JWT_SECRET: dev-secret-key-change-in-prod
      NODE_ENV: development
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
      WEBSOCKET_PORT: 5001
    ports:
      - "5500:5000"
      - "5501:5001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5500
        REACT_APP_WEBSOCKET_URL: ws://localhost:5501
    container_name: todoapp-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5500
      REACT_APP_WEBSOCKET_URL: ws://localhost:5501
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  default:
    name: todoapp-network
